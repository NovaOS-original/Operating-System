name: Kernel build and QEMU smoke test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install build and emulator tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git xorriso qemu-system-x86
      - name: Build kernel and bootable ISO
        run: make
      - name: Smoke-test BIOS boot in QEMU
        shell: bash
        run: |
          set -o pipefail
          timeout 20s qemu-system-x86_64 \
            -machine q35 -m 256M -cdrom build/novaos.iso -boot d \
            -display none -serial stdio -monitor none -no-reboot -no-shutdown \
            2>&1 | tee build/qemu-serial.log || status=$?
          if grep -q "NOVA OS: initialization complete; halted safely" build/qemu-serial.log; then
            echo "NOVA OS serial boot marker found."
          else
            echo "Boot smoke test failed (timeout exit is expected only if the marker was printed)."
            cat build/qemu-serial.log
            exit 1
          fi
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novaos-kernel-and-logs
          path: |
            build/kernel.elf
            build/novaos.iso
            build/qemu-serial.log
